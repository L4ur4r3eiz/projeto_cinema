[project]
name = "etec-em-cena-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "fastapi==0.165.0",
    "psycopg[binary]==3.3.9",
    "python-multipart==0.0.34",
    "sqlalchemy==2.1.9",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
