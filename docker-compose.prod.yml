# Produção (VPS): banco + API. Uso: docker compose -f docker-compose.prod.yml up -d --build
# Usuário, senha e banco vêm do .env ao lado deste arquivo (mesmas chaves do .env.example).
# A API escuta só em 127.0.0.1:8400; o nginx (deploy/nginx.conf) publica o site e repassa /api e /uploads.
services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      COOKIE_SECURE: "1"
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:8400:8000"

volumes:
  dados-postgres:
  uploads:
