# Cabeçalhos de segurança do ETEC em Cena. Na VPS: /etc/nginx/snippets/etec-em-cena-headers.conf
# `always` para valerem também nas respostas de erro. HSTS sem includeSubDomains: não afeta os outros
# subdomínios de taberna3d.com.br (serviços de terceiros). O site é HTTPS-only (redirect 80->443).
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# o build só carrega JS próprio (script-src 'self'); Motion usa estilos inline; fontes do Google; uploads e ruído SVG (data:)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
