# vhost do nginx na VPS: /etc/nginx/sites-available/etec-em-cena.taberna3d.com.br
# O HTTPS é acrescentado pelo certbot: certbot --nginx -d etec-em-cena.taberna3d.com.br
server {
    listen 80;
    server_name etec-em-cena.taberna3d.com.br;
    include /etc/nginx/snippets/etec-em-cena-realip.conf;
    root /opt/etec-em-cena/frontend/dist;
    # uploads de imagem vão até 5 MB (LIMITE_UPLOAD no backend); o padrão do nginx é 1 MB
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://127.0.0.1:8400;
        proxy_set_header Host $host;
        # IP do visitante já resolvido pelo real_ip; sobrescreve qualquer X-Real-IP vindo do cliente
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8400;
    }

    # rotas do React Router (/acesso, /painel...) caem no index.html
    location / {
        try_files $uri /index.html;
    }
}
